<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860" role="img" aria-labelledby="t d">
  <title id="t">LLMOps end-to-end architecture</title>
  <desc id="d">Prompt or data entry flows through NeMo Guardrails, a semantic cache and a router to a vLLM serving engine with PagedAttention, backed by a Qdrant vector database. OpenTelemetry and LangFuse tracing feed an evaluation engine, which triggers Unsloth QLoRA fine-tuning that hot-swaps adapters back into serving.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fa3c8"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fb923c"/>
    </marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #e6edf7; }
      .title { font-size: 26px; font-weight: 700; letter-spacing: .3px; }
      .sub   { font-size: 14px; fill: #8fa3c8; }
      .h     { font-size: 17px; font-weight: 700; }
      .s     { font-size: 12.5px; fill: #b7c4de; }
      .tag   { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #0a0f1f; }
      .lbl   { font-size: 12px; fill: #8fa3c8; font-style: italic; }
      .box   { fill: #101830; stroke-width: 2; }
      .flow  { stroke: #8fa3c8; stroke-width: 2.4; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="860" fill="url(#bg)"/>

  <!-- Header -->
  <text x="40" y="40" class="title">LLMOps End-to-End Architecture</text>
  <text x="40" y="62" class="sub">Request path (top)  ·  Telemetry plane (middle)  ·  Continuous-improvement loop (bottom)</text>

  <!-- ===== Row 1: request path ===== -->
  <!-- 1 Entry -->
  <g>
    <rect class="box" x="40" y="110" width="200" height="120" rx="14" stroke="#60a5fa"/>
    <rect x="40" y="110" width="200" height="26" rx="14" fill="#60a5fa"/><rect x="40" y="124" width="200" height="12" fill="#60a5fa"/>
    <text x="52" y="128" class="tag">1 · ENTRY</text>
    <text x="140" y="162" class="h" text-anchor="middle">Prompt / Data Entry</text>
    <text x="140" y="184" class="s" text-anchor="middle">API gateway · authN/Z</text>
    <text x="140" y="202" class="s" text-anchor="middle">rate limits · tenant quotas</text>
    <text x="140" y="220" class="s" text-anchor="middle">FastAPI · SSE streaming</text>
  </g>

  <!-- 2 NeMo Guardrails -->
  <g>
    <rect class="box" x="300" y="110" width="200" height="120" rx="14" stroke="#f472b6"/>
    <rect x="300" y="110" width="200" height="26" rx="14" fill="#f472b6"/><rect x="300" y="124" width="200" height="12" fill="#f472b6"/>
    <text x="312" y="128" class="tag">2 · SAFETY</text>
    <text x="400" y="162" class="h" text-anchor="middle">NeMo Guardrails</text>
    <text x="400" y="184" class="s" text-anchor="middle">PII mask · injection classifier</text>
    <text x="400" y="202" class="s" text-anchor="middle">Llama Guard · topic rails</text>
    <text x="400" y="220" class="s" text-anchor="middle">+ output rails · canary</text>
  </g>

  <!-- 3 Semantic Cache -->
  <g>
    <rect class="box" x="560" y="110" width="200" height="120" rx="14" stroke="#fbbf24"/>
    <rect x="560" y="110" width="200" height="26" rx="14" fill="#fbbf24"/><rect x="560" y="124" width="200" height="12" fill="#fbbf24"/>
    <text x="572" y="128" class="tag">3 · COST</text>
    <text x="660" y="162" class="h" text-anchor="middle">Semantic Cache</text>
    <text x="660" y="184" class="s" text-anchor="middle">Redis + vector match (τ-calibrated)</text>
    <text x="660" y="202" class="s" text-anchor="middle">tenant-namespaced · TTL</text>
    <text x="660" y="220" class="s" text-anchor="middle">exact-hash L1 cache</text>
  </g>

  <!-- 4 Router -->
  <g>
    <rect class="box" x="820" y="110" width="200" height="120" rx="14" stroke="#a78bfa"/>
    <rect x="820" y="110" width="200" height="26" rx="14" fill="#a78bfa"/><rect x="820" y="124" width="200" height="12" fill="#a78bfa"/>
    <text x="832" y="128" class="tag">4 · ROUTING</text>
    <text x="920" y="162" class="h" text-anchor="middle">Router / Cascade</text>
    <text x="920" y="184" class="s" text-anchor="middle">8B ⇄ 70B ⇄ frontier</text>
    <text x="920" y="202" class="s" text-anchor="middle">difficulty classifier</text>
    <text x="920" y="220" class="s" text-anchor="middle">budget-aware degrade</text>
  </g>

  <!-- 5 vLLM -->
  <g filter="url(#glow)">
    <rect class="box" x="1080" y="110" width="300" height="120" rx="14" stroke="#4ade80"/>
    <rect x="1080" y="110" width="300" height="26" rx="14" fill="#4ade80"/><rect x="1080" y="124" width="300" height="12" fill="#4ade80"/>
  </g>
  <text x="1092" y="128" class="tag">5 · SERVING</text>
  <text x="1230" y="160" class="h" text-anchor="middle">vLLM Serving Engine</text>
  <!-- PagedAttention mini-blocks -->
  <g>
    <rect x="1100" y="172" width="22" height="16" rx="3" fill="#4ade80" opacity=".9"/>
    <rect x="1126" y="172" width="22" height="16" rx="3" fill="#22d3ee" opacity=".9"/>
    <rect x="1152" y="172" width="22" height="16" rx="3" fill="#4ade80" opacity=".9"/>
    <rect x="1178" y="172" width="22" height="16" rx="3" fill="#2a3556"/>
    <rect x="1204" y="172" width="22" height="16" rx="3" fill="#22d3ee" opacity=".9"/>
    <rect x="1230" y="172" width="22" height="16" rx="3" fill="#2a3556"/>
    <rect x="1256" y="172" width="22" height="16" rx="3" fill="#4ade80" opacity=".9"/>
    <rect x="1282" y="172" width="22" height="16" rx="3" fill="#22d3ee" opacity=".9"/>
    <rect x="1308" y="172" width="22" height="16" rx="3" fill="#2a3556"/>
    <rect x="1334" y="172" width="22" height="16" rx="3" fill="#4ade80" opacity=".9"/>
  </g>
  <text x="1230" y="206" class="s" text-anchor="middle">PagedAttention · KV blocks (non-contiguous)</text>
  <text x="1230" y="222" class="s" text-anchor="middle">continuous batching · chunked prefill · multi-LoRA</text>

  <!-- Response -->
  <g>
    <rect class="box" x="1430" y="110" width="130" height="120" rx="14" stroke="#94a3b8"/>
    <text x="1495" y="158" class="h" text-anchor="middle">Response</text>
    <text x="1495" y="180" class="s" text-anchor="middle">streamed tokens</text>
    <text x="1495" y="198" class="s" text-anchor="middle">output rails ✓</text>
    <text x="1495" y="216" class="s" text-anchor="middle">cache write-back</text>
  </g>

  <!-- request-path arrows -->
  <path class="flow" d="M240 170 H300" marker-end="url(#arrow)"/>
  <path class="flow" d="M500 170 H560" marker-end="url(#arrow)"/>
  <path class="flow" d="M760 170 H820" marker-end="url(#arrow)"/>
  <path class="flow" d="M1020 170 H1080" marker-end="url(#arrow)"/>
  <path class="flow" d="M1380 170 H1430" marker-end="url(#arrow)"/>

  <!-- cache hit fast path -->
  <path d="M660 110 C660 78 1495 78 1495 110" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="1070" y="86" class="lbl" text-anchor="middle" style="fill:#fbbf24">cache hit → skip router, retrieval and GPU (fast path)</text>

  <!-- ===== Qdrant ===== -->
  <g>
    <rect class="box" x="850" y="330" width="260" height="110" rx="14" stroke="#22d3ee"/>
    <rect x="850" y="330" width="260" height="26" rx="14" fill="#22d3ee"/><rect x="850" y="344" width="260" height="12" fill="#22d3ee"/>
    <text x="862" y="348" class="tag">6 · RETRIEVAL</text>
    <text x="980" y="380" class="h" text-anchor="middle">Qdrant Vector DB</text>
    <text x="980" y="400" class="s" text-anchor="middle">hybrid dense + sparse (RRF) · HNSW</text>
    <text x="980" y="418" class="s" text-anchor="middle">ACL/metadata filters · cross-encoder rerank</text>
    <text x="980" y="434" class="s" text-anchor="middle">parent–child chunks · alias blue/green</text>
  </g>
  <path class="flow" d="M920 230 V330" marker-end="url(#arrow)"/>
  <text x="930" y="283" class="lbl">query + filters</text>
  <path class="flow" d="M1110 385 H1230 V232" marker-end="url(#arrowG)" style="stroke:#4ade80"/>
  <text x="1238" y="320" class="lbl" style="fill:#4ade80">top-k context → prompt</text>

  <!-- ===== Telemetry bus ===== -->
  <g>
    <rect x="40" y="500" width="1300" height="40" rx="10" fill="#0e2a3a" stroke="#38bdf8" stroke-width="2"/>
    <text x="690" y="525" class="h" text-anchor="middle" style="fill:#7dd3fc">OpenTelemetry bus · traces · metrics (TTFT · ITL · TPS · tokens · $) · eval scores</text>
  </g>
  <g stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5 5" fill="none" marker-end="url(#arrowT)">
    <path d="M140 230 V500"/>
    <path d="M400 230 V500"/>
    <path d="M660 230 V500"/>
    <path d="M980 440 V500"/>
    <path d="M1300 230 V500"/>
  </g>

  <!-- ===== Row 3: improvement loop ===== -->
  <!-- LangFuse -->
  <g>
    <rect class="box" x="40" y="600" width="340" height="130" rx="14" stroke="#38bdf8"/>
    <rect x="40" y="600" width="340" height="26" rx="14" fill="#38bdf8"/><rect x="40" y="614" width="340" height="12" fill="#38bdf8"/>
    <text x="52" y="618" class="tag">7 · OBSERVABILITY</text>
    <text x="210" y="652" class="h" text-anchor="middle">OpenTelemetry → LangFuse</text>
    <text x="210" y="674" class="s" text-anchor="middle">trace tree · prompt/index versions</text>
    <text x="210" y="692" class="s" text-anchor="middle">cost attribution · Prometheus/Grafana</text>
    <text x="210" y="710" class="s" text-anchor="middle">burn-rate SLO alerts · drift detectors</text>
  </g>
  <path class="flow" d="M210 540 V600" marker-end="url(#arrowT)" style="stroke:#38bdf8"/>

  <!-- Eval engine -->
  <g>
    <rect class="box" x="470" y="600" width="340" height="130" rx="14" stroke="#fb923c"/>
    <rect x="470" y="600" width="340" height="26" rx="14" fill="#fb923c"/><rect x="470" y="614" width="340" height="12" fill="#fb923c"/>
    <text x="482" y="618" class="tag">8 · EVALUATION</text>
    <text x="640" y="652" class="h" text-anchor="middle">Evaluation Engine</text>
    <text x="640" y="674" class="s" text-anchor="middle">RAG triad · LLM-as-judge (κ-calibrated)</text>
    <text x="640" y="692" class="s" text-anchor="middle">Ragas · DeepEval · TruLens</text>
    <text x="640" y="710" class="s" text-anchor="middle">golden set · paired-bootstrap CI gates</text>
  </g>
  <path class="flow" d="M380 665 H470" marker-end="url(#arrow)"/>
  <text x="425" y="656" class="lbl" text-anchor="middle">sampled</text>
  <text x="425" y="688" class="lbl" text-anchor="middle">traces</text>

  <!-- Fine-tune trigger -->
  <g>
    <rect class="box" x="900" y="600" width="360" height="130" rx="14" stroke="#fb923c"/>
    <rect x="900" y="600" width="360" height="26" rx="14" fill="#fb923c"/><rect x="900" y="614" width="360" height="12" fill="#fb923c"/>
    <text x="912" y="618" class="tag">9 · FLYWHEEL</text>
    <text x="1080" y="652" class="h" text-anchor="middle">Fine-Tuning Trigger</text>
    <text x="1080" y="674" class="s" text-anchor="middle">Unsloth · QLoRA (NF4, r=16–64)</text>
    <text x="1080" y="692" class="s" text-anchor="middle">failures → curated data → SFT/DPO</text>
    <text x="1080" y="710" class="s" text-anchor="middle">gate → registry → canary → promote</text>
  </g>
  <path class="flow" d="M810 665 H900" marker-end="url(#arrowO)" style="stroke:#fb923c"/>
  <text x="855" y="656" class="lbl" text-anchor="middle" style="fill:#fb923c">regression</text>
  <text x="855" y="688" class="lbl" text-anchor="middle" style="fill:#fb923c">/ drift</text>

  <!-- Loop back to vLLM -->
  <path d="M1260 665 H1460 V300 H1360 V232" fill="none" stroke="#fb923c" stroke-width="2.4" stroke-dasharray="8 5" marker-end="url(#arrowO)"/>
  <text x="1470" y="480" class="lbl" style="fill:#fb923c" transform="rotate(90 1470 480)" text-anchor="middle">hot-swap LoRA adapter (multi-LoRA) · canary 5% → 100%</text>

  <!-- Data / feedback return -->
  <path d="M1080 730 V790 H20 V170 H40" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3 6" marker-end="url(#arrow)"/>
  <text x="610" y="810" class="lbl" text-anchor="middle">user feedback · human-reviewed failures → new golden cases + training data (closed loop)</text>

  <!-- Legend -->
  <g transform="translate(40,832)">
    <line x1="0" y1="0" x2="34" y2="0" class="flow"/><text x="42" y="4" class="s">request path</text>
    <line x1="170" y1="0" x2="204" y2="0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5"/><text x="212" y="4" class="s">telemetry</text>
    <line x1="310" y1="0" x2="344" y2="0" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 5"/><text x="352" y="4" class="s">cache fast path</text>
    <line x1="480" y1="0" x2="514" y2="0" stroke="#fb923c" stroke-width="2" stroke-dasharray="8 5"/><text x="522" y="4" class="s">improvement loop</text>
  </g>
</svg>
